modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/team-abnormals/personality/issues"
license = "https://github.com/team-abnormals/personality/blob/main/LICENSE"

[[mixins]]
    config = "personality.mixins.json"

[[mods]]
    modId = "personality"
    version = "${mod_version}"
    logoFile = "logo.png"
    itemIcon = "minecraft:oak_stairs"
    configBackground = "minecraft:textures/block/oak_planks.png"
    authors = "Team Abnormals"
    credits = "Jackson, bageldotjpg"
    displayURL = "https://www.teamabnormals.com/mods/personality"
    displayName = "Personality"
    description = '''
    Adds more cosmetic features and animations to players, as well as new player actions like sitting and crawling.
    '''

[[dependencies.personality]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${mc_version}]"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.personality]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.personality]]
    modId = "blueprint"
    type = "required"
    versionRange = "[${blueprint},)"
    ordering = "AFTER"
    side = "BOTH"